name: Release

on:
  push:
    branches:
      - release
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  init:
    name: Init
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.value }}
      changelog: ${{ steps.get_changelog.outputs.value }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get version from VERSION file
        id: get_version
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Extract changelog for this version
        id: get_changelog
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          CHANGELOG=$(awk -v ver="\`$VERSION\`" '
            /^## / {
              if (found) exit
              if (index($0, ver) > 0) found=1
              next
            }
            found { print }
          ' CHANGELOG.md | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' | sed '/^$/N;/^\n$/d')

          # Use a random delimiter so no line of the changelog can end the output early.
          DELIMITER="CHANGELOG_$(openssl rand -hex 16)"
          {
            echo "value<<$DELIMITER"
            echo "$CHANGELOG"
            echo "$DELIMITER"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: ["init"]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x86_64
            runner-os: windows-latest
            artifact-name: wally-${{ needs.init.outputs.version }}-windows-x86_64
            cargo-target: x86_64-pc-windows-msvc

          - name: Linux x86_64
            runner-os: ubuntu-22.04
            artifact-name: wally-${{ needs.init.outputs.version }}-linux-x86_64
            cargo-target: x86_64-unknown-linux-gnu

          - name: macOS aarch64
            runner-os: macos-latest
            artifact-name: wally-${{ needs.init.outputs.version }}-macos-aarch64
            cargo-target: aarch64-apple-darwin

    name: Build - ${{ matrix.name }}
    runs-on: ${{ matrix.runner-os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.cargo-target }}

      - name: Link OpenSSL statically
        if: runner.os != 'Windows'
        run: echo "OPENSSL_STATIC=1" >> "$GITHUB_ENV"

      - name: Build binary
        run: cargo build --release --locked --target ${{ matrix.cargo-target }}

      - name: Create release archive
        run: ./scripts/zip-release.sh ${{ matrix.cargo-target }}

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: release.zip

  release-github:
    name: Release (GitHub)
    runs-on: ubuntu-latest
    needs: ["init", "build"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download releases
        uses: actions/download-artifact@v4
        with:
          path: ./releases

      - name: Unpack releases
        run: ./scripts/unpack-releases.sh "./releases"

      - name: Write changelog to file
        env:
          CHANGELOG: ${{ needs.init.outputs.changelog }}
        run: printf '%s\n' "$CHANGELOG" > /tmp/changelog.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ needs.init.outputs.version }}" \
            --target "$GITHUB_SHA" \
            --title "${{ needs.init.outputs.version }}" \
            --notes-file /tmp/changelog.txt \
            ./releases/*.zip
